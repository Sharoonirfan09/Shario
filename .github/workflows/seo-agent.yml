name: SEO Agent (Claude Code)

# Manual/API entry point only — this is what n8n calls via the GitHub REST
# API (POST /repos/{owner}/{repo}/actions/workflows/seo-agent.yml/dispatches)
# to hand Claude Code a task. No push/pull_request/schedule trigger is wired
# up, so this workflow only ever runs when explicitly dispatched.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Instructions for Claude Code to carry out."
        required: true
        type: string
      mode:
        description: "Operating mode label, passed through to Claude Code as context (e.g. audit, content, fix). Informational only in this first version — no branching logic depends on it yet."
        required: true
        type: string
        default: "audit"

# Least privilege for what this workflow actually does: read the repo, push
# a working branch, open a PR. No `issues`, no `id-token`, nothing that
# touches repo settings, branch protection, or merge rights.
permissions:
  contents: write
  pull-requests: write

# One agent run at a time; never cancel a run that may already be pushing a
# branch or opening a PR.
concurrency:
  group: seo-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Bringing the dispatch inputs in as job-level env vars (rather than
      # interpolating ${{ github.event.inputs.* }} directly into `run:`
      # script text below) avoids GitHub Actions script-injection: `task`
      # is attacker/operator-controlled free text, and a directly-inlined
      # expression becomes literal bash source before execution. Referenced
      # as "$TASK"/"$MODE" (quoted) in every run step instead.
      TASK: ${{ github.event.inputs.task }}
      MODE: ${{ github.event.inputs.mode }}
      BASE_BRANCH: main
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Claude Code never runs on `main` itself: this branch switch happens
      # before the action below touches a single file, and no later step
      # ever checks out or pushes to `main` again.
      - name: Create working branch
        run: |
          branch="seo-agent/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      # Official Claude Code GitHub Action (anthropics/claude-code-action).
      # Passing `prompt` switches it into headless automation mode: it acts
      # on the task text directly rather than waiting for an @claude mention
      # on an issue/PR. It edits files in this checked-out working branch
      # only — it does not create branches, commit, push, or open a PR
      # itself, so it has no path to `main`. Verify `@v1` is still the
      # action's current recommended tag before relying on this long-term.
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Mode: ${{ env.MODE }}

            Task:
            ${{ env.TASK }}
          claude_args: "--max-turns 15"
          track_progress: false

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "seo-agent[bot]"
          git config user.email "seo-agent-bot@users.noreply.github.com"
          git add -A
          git commit -m "SEO agent (${MODE}): automated changes" -m "Run: ${GITHUB_RUN_ID}"

      - name: Push working branch
        if: steps.diff.outputs.changed == 'true'
        run: git push origin "${BRANCH}"

      # Opens the PR as a draft against `main` and stops — nothing in this
      # workflow merges it. Review and merge is a manual, separate action.
      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Automated PR opened by \`.github/workflows/seo-agent.yml\`, dispatched via the GitHub API (intended caller: n8n)."
            echo
            echo "**Mode:** ${MODE}"
            echo
            echo "**Task given to Claude Code:**"
            echo
            echo "${TASK}"
            echo
            echo "---"
            echo "Opened as a draft. This workflow never merges — review the diff before merging."
          } > pr_body.md

          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "${BRANCH}" \
            --title "SEO agent (${MODE}): run ${GITHUB_RUN_ID}" \
            --draft \
            --body-file pr_body.md

      - name: No changes summary
        if: steps.diff.outputs.changed == 'false'
        run: echo "Claude Code made no file changes for this task — nothing to open a PR for."
