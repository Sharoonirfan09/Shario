name: SHARIO SEO Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'SEO task instruction'
        required: true
        type: string
      mode:
        description: 'report_only | requires_approval'
        required: true
        default: 'report_only'
        type: string

jobs:
  seo-agent:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          fi

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Create SEO branch
        id: branch
        run: |
          TIMESTAMP=$(date +%Y-%m-%dT%H-%M-%S)
          MODE="${{ github.event.inputs.mode }}"
          BRANCH="seo/${MODE}-${TIMESTAMP}"

          echo "branch_name=${BRANCH}" >> "$GITHUB_OUTPUT"
          git checkout -b "${BRANCH}"

      - name: Run Claude Code SEO Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK: ${{ github.event.inputs.task }}
          MODE: ${{ github.event.inputs.mode }}
          BRANCH: ${{ steps.branch.outputs.branch_name }}

        run: |
          set -e

          claude --print \
            --model claude-sonnet-4-6 \
            --max-turns 12 \
            "You are the SEO engineer for the SHARIO website.

          WEBSITE: https://shario.ae
          REPOSITORY: Sharoonirfan09/Shario
          STACK: Next.js, TypeScript, React
          LANGUAGES: English, Arabic, Russian

          PRODUCTION BRANCH: main
          CURRENT BRANCH: ${BRANCH}
          MODE: ${MODE}

          SAFETY RULES:
          - NEVER push directly to main.
          - NEVER merge a Pull Request.
          - NEVER deploy to Vercel.
          - NEVER modify DNS.
          - NEVER modify production environment variables.
          - NEVER modify Vercel configuration.
          - NEVER change visual design.
          - NEVER change brand copy.
          - NEVER change colors.
          - NEVER change fonts.
          - NEVER change the SHARIO logo.
          - NEVER make unrelated code changes.

          REPORT-ONLY MODE:
          If MODE is report_only:
          - DO NOT modify repository files.
          - DO NOT commit anything.
          - DO NOT push anything.
          - DO NOT create a Pull Request.
          - Analyse the repository only.
          - Return the ACTUAL SEO findings in your final response.
          - Do not simply say that findings were saved somewhere.

          APPROVAL MODE:
          If MODE is requires_approval:
          - Make ONLY safe SEO changes related to the requested task.
          - Do not make visual or branding changes.
          - Run available build/validation commands.
          - Keep changes on the SEO branch.
          - Do NOT merge anything.

          AUDIT:
          Check:
          1. Metadata
          2. Title tags
          3. Meta descriptions
          4. Open Graph
          5. Twitter metadata
          6. Robots.txt
          7. Sitemap
          8. Canonical URLs
          9. Hreflang
          10. Structured data / JSON-LD
          11. Broken internal links
          12. Internal linking
          13. Image alt text
          14. Heading structure
          15. Indexability
          16. Duplicate content
          17. URL structure
          18. Language implementation
          19. Technical SEO
          20. Page performance issues visible in code

          For each important finding provide:
          - Priority: Critical / High / Medium / Low
          - Issue
          - Why it matters
          - Exact file/page affected
          - Recommended fix

          TASK:
          ${TASK}

          First understand the existing SEO architecture.
          Do not invent problems.
          Be precise and practical.

          Return the complete SEO report when finished." \
            > /tmp/seo_report.md

          echo "===== SHARIO SEO REPORT ====="
          cat /tmp/seo_report.md
          echo "===== END SEO REPORT ====="

      - name: Publish SEO report
        if: always()
        run: |
          {
            echo "## SHARIO SEO Agent Report"
            echo ""
            echo "**Mode:** ${{ github.event.inputs.mode }}"
            echo ""
            echo "**Branch:** ${{ steps.branch.outputs.branch_name }}"
            echo ""
            echo "### Claude SEO Analysis"
            echo ""
            if [ -f /tmp/seo_report.md ]; then
              cat /tmp/seo_report.md
            else
              echo "No SEO report was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore repository in report-only mode
        if: github.event.inputs.mode == 'report_only'
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Create Pull Request
        if: github.event.inputs.mode == 'requires_approval' && steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.branch_name }}
          base: main
          title: "SEO: automated improvements"
          body: |
            ## SHARIO SEO Automation

            This Pull Request was created by the SHARIO SEO Agent.

            ### Task
            ${{ github.event.inputs.task }}

            ### Safety
            - No direct push to main
            - No automatic merge
            - No deployment
            - SEO-related changes only
            - Review required before merging

            Please review all changes carefully before merging.
          labels: seo-automation,requires-review

      - name: Final report
        if: always()
        run: |
          echo "======================================"
          echo "SHARIO SEO AGENT"
          echo "======================================"
          echo "Mode: ${{ github.event.inputs.mode }}"
          echo "Branch: ${{ steps.branch.outputs.branch_name }}"
          echo "Changes detected: ${{ steps.changes.outputs.has_changes }}"
          echo "======================================"
